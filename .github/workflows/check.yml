name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/data.js
          node --check lib/analytics.js
          node --check lib/client.js
      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client?.platform) process.exit(1); console.log(p.name, p.version)"
